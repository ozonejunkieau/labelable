# 400 x 300 px shelf tag for a 4-colour (black/white/yellow/red) e-paper panel.
#
# dpi 254 makes 0.1 mm = 1 px, so every *_mm value below is pixels / 10:
# width_mm: 40 is 400 px. Integer dpi keeps that mapping exact.
name: shelf-tag
description: 4-colour e-paper shelf tag
engine: image
dimensions:
  width_mm: 40
  height_mm: 30
dpi: 254

# Index order is the contract with whatever writes the panel: the output PNG
# uses palette index 0 for black, 1 for white, 2 for yellow, 3 for red.
# measured_rgb is how each ink really looks on the panel. Dithering matches
# photo pixels against these, while the PNG keeps the nominal rgb values.
# Measure your own panel (photograph a solid fill of each ink) and replace them.
palette:
  - { name: black, rgb: "#000000", measured_rgb: "#2b2b33" }
  - { name: white, rgb: "#ffffff", measured_rgb: "#d8d8cf" }
  - { name: yellow, rgb: "#ffff00", measured_rgb: "#d6c22f" }
  - { name: red, rgb: "#ff0000", measured_rgb: "#9c2b25" }
background: white

fields:
  - name: title
  - name: description
  - name: price
  - name: id
  - name: photo
    type: image # PIL Image or bytes from Python; base64 / data URI over the API

# Elements draw in order: each rect comes before the text that sits on it.
elements:
  # Red header bar with white title
  - type: rect
    bounds: { x_mm: 0, y_mm: 0, width_mm: 40, height_mm: 6 }
    fill: red
  - type: text
    field: title
    color: white
    font: Roboto-Bold
    font_size: 80
    auto_scale: true
    bounds: { x_mm: 1.5, y_mm: 0.6, width_mm: 37, height_mm: 4.8 }
    vertical_align: middle
    vertical_align_to_ink: true # centre the glyphs themselves in the bar

  # Photo, cropped to fill its box and dithered to the four inks
  - type: image
    field: photo
    fit: cover
    bounds: { x_mm: 1, y_mm: 7, width_mm: 18, height_mm: 16 }

  # Description, wrapped and shrunk to fit
  - type: text
    field: description
    font: Roboto-Regular
    font_size: 40
    auto_scale: true
    wrap: true
    line_spacing: 1.15
    bounds: { x_mm: 20.5, y_mm: 7.5, width_mm: 18.5, height_mm: 7 }
    vertical_align_to_ink: true

  # Yellow price badge with a black outline
  - type: rect
    bounds: { x_mm: 20.5, y_mm: 15.5, width_mm: 18.5, height_mm: 7.5 }
    fill: yellow
    outline: black
    outline_width_mm: 0.2
    radius_mm: 1
  - type: text
    field: price
    font: Roboto-Bold
    font_size: 80
    auto_scale: true
    alignment: center
    vertical_align: middle
    vertical_align_to_ink: true
    bounds: { x_mm: 21.5, y_mm: 16.5, width_mm: 16.5, height_mm: 5.5 }

  # Footer: item id and its barcode
  - type: text
    field: id
    font: Roboto-Regular
    font_size: 28
    vertical_align: middle
    vertical_align_to_ink: true
    bounds: { x_mm: 1, y_mm: 24.5, width_mm: 12, height_mm: 4.5 }
  - type: code128
    field: id
    color: black
    x_mm: 27
    y_mm: 26.75
    height_mm: 4.5
    module_width_mm: 0.2
