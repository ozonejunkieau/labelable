# Labelable Configuration
# Copy this file to config.yaml and update with your settings

# Queue timeout in seconds (jobs older than this are dropped)
queue_timeout_seconds: 300

# Directory containing label template YAML files
templates_dir: ./templates

# API key for external access (optional)
# If set, API requests must include this key via:
#   - X-API-Key header
#   - Authorization: Bearer <key> header
#   - api_key query parameter
# Requests via Home Assistant Ingress (sidebar) bypass this check.
# NOTE: the key only protects the REST API (/api/v1) and can be bypassed;
# the web UI's print routes and /mcp are not covered. Keep the ports on a
# trusted network. See "Security" in README.md.
# api_key: your-secret-key-here

# User mapping for Home Assistant Ingress (maps HA user IDs to display names)
# Get user IDs from Home Assistant: Settings > People > click user > see URL
user_mapping:
  # "abc123-def456-user-uuid": "Your Name"

# Default user when not accessed via HA or user not in mapping
default_user: ""

# Enable MCP server for AI assistant integration (optional)
# Mounts at /mcp using Streamable HTTP transport
# Requires: uv sync --group mcp
# mcp_enabled: true

# Cloudflare Queue consumer (optional)
# Receives print jobs pushed to a Cloudflare Queue by external systems
# (e.g. the Labelable Obsidian plugin). The consumer polls the queue in the
# background and dispatches jobs to the appropriate printer and template.
#
# The API token needs Cloudflare Queues Read permission.
# Alternatively, leave api_token blank and set LABELABLE_CF_API_TOKEN env var.
#
# cloudflare_queue:
#   enabled: true
#   account_id: "your-cloudflare-account-id"
#   queue_id: "your-queue-id"
#   api_token: ""               # or set LABELABLE_CF_API_TOKEN env var
#   poll_interval_seconds: 5    # how often to poll for new messages
#   batch_size: 10              # max messages to pull per request
#   visibility_timeout_ms: 30000  # ms before unacked message is re-delivered

# Printer definitions
printers:
  # ZPL printer over TCP
  - name: warehouse-zpl
    type: zpl
    connection:
      type: tcp
      host: 192.168.1.100
      port: 9100  # Default ZPL port
    healthcheck:
      interval: 60
      command: "~HS"  # Host status query

  # EPL2 printer over TCP
  # - name: office-epl
  #   type: epl2
  #   connection:
  #     type: tcp
  #     host: 192.168.1.101
  #     port: 9100
  #   healthcheck:
  #     interval: 60
  #     command: "UQ"  # Print info query

  # Serial printer example - untested
  # - name: usb-printer
  #   type: zpl
  #   connection:
  #     type: serial
  #     device: /dev/ttyUSB0
  #     baudrate: 9600

  # Brother P-Touch over USB (local machine)
  # - name: ptouch
  #   type: ptouch
  #   connection:
  #     type: usb
  #     vendor_id: 0x04F9   # Brother
  #     product_id: 0x20AF  # PT-P710BT

  # Brother P-Touch via the polling bridge daemon (labelable-bridge).
  # Usually created automatically when a daemon registers.
  # - name: remote-ptouch
  #   type: ptouch
  #   connection:
  #     type: bridge
  #     serial_number: "ABC123"
  #     tape_width_mm: 9

  # ESP32-P4 labelable-usb bridge: one board drives several USB printers
  # behind a hub (1 P-Touch, up to 3 ZPL, up to 3 EPL2). The printer `type`
  # picks what Labelable sends: raster rows for ptouch, raw ZPL for zpl, raw
  # EPL2 for epl2. `printer` selects the device on the board (ids are listed
  # by http://<host>/status, e.g. zpl-46J152601234); it may be omitted while
  # the board has only one printer of that kind.
  # The older connection types `ptouch_bridge` and `zebra_bridge` still load
  # as deprecated aliases for `usb_bridge`.
  # - name: net-ptouch
  #   type: ptouch
  #   connection:
  #     type: usb_bridge
  #     host: labelable-usb-a1b2c3  # hostname or IP (DHCP - prefer the hostname)
  #     port: 80
  #     # Bearer token for POST /print. Falls back to the
  #     # LABELABLE_USB_BRIDGE_TOKEN environment variable when unset.
  #     token: "changeme"
  #     printer: ptouch-000F1Z123456
  #     # Fallback media type used only when the device has never read the
  #     # printer. Live status always wins. 3 = non-laminated.
  #     media_type: 3
  #     # Skip the device's tape width validation. Unsafe: content outside the
  #     # printable pin window is silently discarded.
  #     force: false
  #   healthcheck:
  #     interval: 60

  # Zebra ZPL printer on the same board. The printer must be in ZPL mode.
  # - name: net-zebra
  #   type: zpl
  #   connection:
  #     type: usb_bridge
  #     host: labelable-usb-a1b2c3
  #     printer: zpl-46J152601234
  #     # Seconds to wait for a job to finish. Keep it above the firmware's
  #     # CONFIG_LU_ZPL_JOB_TIMEOUT_S (300 s). Default 330.
  #     completion_timeout_s: 330
  #   healthcheck:
  #     interval: 60

  # Zebra EPL2 printer (e.g. LP2844) on the same board.
  # - name: net-epl
  #   type: epl2
  #   connection:
  #     type: usb_bridge
  #     host: labelable-usb-a1b2c3
  #     printer: epl-UKQ1935HLU
  #     # Keep above the firmware's CONFIG_LU_EPL_JOB_TIMEOUT_S (120 s).
  #     # Default 150.
  #     completion_timeout_s: 150
  #   healthcheck:
  #     interval: 60
